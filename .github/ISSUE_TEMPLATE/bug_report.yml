name: 🐛 报告 Bug
description: 报告插件使用中的问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你报告问题！请填写以下信息以帮助我们更好地定位问题。
  
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请详细描述你遇到的问题
      placeholder: 例如：任务完成后没有收到通知...
    validations:
      required: true
  
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望的行为是什么？
      placeholder: 例如：任务完成后应该收到系统通知...
    validations:
      required: true
  
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？
    validations:
      required: true
  
  - type: input
    id: system
    attributes:
      label: 系统信息
      description: 你的操作系统是什么？
      placeholder: 例如：Ubuntu 24.04 / macOS 14.0 / Windows 11
    validations:
      required: true
  
  - type: input
    id: opencode-version
    attributes:
      label: OpenCode 版本
      description: 运行 `opencode --version` 获取版本号
    validations:
      required: true
  
  - type: textarea
    id: logs
    attributes:
      label: 日志信息
      description: 请提供相关日志（如果有）
      render: shell
    validations:
      required: false
  
  - type: textarea
    id: config
    attributes:
      label: 配置信息
      description: 请提供你的 notification.json 配置（请移除敏感信息）
      render: json
    validations:
      required: false
