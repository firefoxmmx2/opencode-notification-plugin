name: ✨ 功能建议
description: 为插件提出新功能建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出功能建议！请详细描述你的想法。
  
  - type: textarea
    id: problem
    attributes:
      label: 问题背景
      description: 这个功能解决了什么问题？
      placeholder: 例如：我希望在使用通知时可以...
    validations:
      required: true
  
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 你希望如何实现这个功能？
      placeholder: 例如：希望能添加 XX 配置选项...
    validations:
      required: true
  
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 你还考虑过哪些替代方案？
    validations:
      required: false
  
  - type: textarea
    id: examples
    attributes:
      label: 使用示例
      description: 如果有的话，请提供使用示例
      render: json
    validations:
      required: false
